name: Build and release APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # A deleted ref has no new source revision to build.
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build dependencies
        # Keep these versions aligned with app/build.gradle and AGP 8.6.
        run: |
          sdkmanager --install --channel=3 \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;29.0.13113456"

      - name: Build APKs and run lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/gpu-check-arm64-v8a-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/gpu-check-arm64-v8a-release-unsigned.apk
          (
            cd dist
            sha256sum -- *.apk > SHA256SUMS.txt
          )

      - name: Publish directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Unique tags keep concurrent pushes and re-runs from replacing assets.
          release_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated APK build for ${GITHUB_REF_NAME}.

          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Platform: Android 8.0+ (API 26+), arm64-v8a.
          - gpu-check-arm64-v8a-debug.apk: installable APK signed with a temporary debug key. Different runs may require uninstalling the previous build before installation.
          - gpu-check-arm64-v8a-release-unsigned.apk: release build; sign it with your own key before installation.
          - SHA256SUMS.txt: SHA-256 checksums for both APKs.

          Build files are attached directly to this release.
          EOF

          gh release create "$release_tag" \
            dist/gpu-check-arm64-v8a-debug.apk \
            dist/gpu-check-arm64-v8a-release-unsigned.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "GPU Check build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA:0:7})" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease

          printf '### Release\n\n%s\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${release_tag}" \
            >> "$GITHUB_STEP_SUMMARY"
